<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Empanadas El Sabor</title>
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- CSS interno agregado directamente en la cabecera del documento -->
    <style>
        .formulario-contacto {
            background-color: #f9f9f9;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ccc;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .formulario-contacto label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .formulario-contacto input, 
        .formulario-contacto textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--color-primario);
            border-radius: 4px;
            font-family: var(--fuente-principal);
        }
        /* Pseudo-clase focus para resaltar el campo cuando el usuario escribe */
        .formulario-contacto input:focus, 
        .formulario-contacto textarea:focus {
            outline: 2px solid var(--color-secundario);
        }
    </style>
</head>
<body>
    <header>
        <div class="contenedor-header">
            <!-- CSS en linea aplicado para mantener el diseño en todas las paginas -->
            <h1 style="color: var(--color-secundario); font-size: 2.5rem; text-shadow: 1px 1px 2px black;">Empanadas El Sabor</h1>
            <p>Haz tu pedido</p>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contacto-seccion" style="padding: 20px;">
            <h2 style="text-align: center;">Escríbenos</h2>
            <p style="text-align: center;">Realiza tu pedido o déjanos tus sugerencias llenando el siguiente formulario:</p>
            
            <form action="#" method="POST" class="formulario-contacto">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="mensaje">Mensaje o Pedido:</label>
                <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                
                <input type="submit" value="Enviar Mensaje" class="btn-enviar">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Empanadas El Sabor. Todos los derechos reservados.</p>
        <p>Haz tus pedidos por <a href="https://wa.me/593962036590" target="_blank">WhatsApp</a></p>
    </footer>
</body>
</html>
